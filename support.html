<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090b16" />
    <title>支持作者｜共识实验室</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

    <main class="app-shell support-page-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="返回共识实验室首页">
          <span class="brand-mark"><img src="./logo.svg" alt="" /></span>
          <span>
            <strong>共识实验室</strong>
            <small>CONSENSUS LAB</small>
          </span>
        </a>
        <a class="support-back-link" href="./">← 返回游戏</a>
      </header>

      <section class="support-page" aria-labelledby="support-title">
        <div class="support-copy">
          <p class="eyebrow">SUPPORT THE CREATOR</p>
          <h1 id="support-title">感谢你的<br />每一次支持</h1>
          <p class="lead">
            共识实验室仍在持续完善。你的支持会帮助我继续制作题目、优化体验，并让这个小小的博弈实验走得更远。
          </p>
          <div class="support-notes" aria-label="项目特点">
            <span>独立开发</span>
            <span>持续更新</span>
            <span>感谢参与</span>
          </div>
        </div>

        <article class="glass-card support-code-card">
          <span class="card-label">支持作者</span>
          <div class="support-image-frame">
            <img src="./support-author.jpg" alt="支持作者二维码" />
          </div>
          <p class="support-scan-tip">使用另一台设备扫码，或长按保存图片后在手机中识别。</p>
          <a class="support-original-link" href="./support-author.jpg" target="_blank" rel="noopener">查看原图</a>
        </article>
      </section>
    </main>
  </body>
</html>
